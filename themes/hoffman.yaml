    boundary: {color: border, width_pt: 0.68, style: solid, cap: round, join: round}
    emphasis: {color: connector, width_pt: 1.05, style: solid, cap: round, join: round}
    flow: {color: connector, width_pt: 0.85, style: solid, cap: round, join: round}
    optional_flow: {color: border, width_pt: 0.60, style: dotted, cap: round, join: round}
    graph_flow: {color: connector, width_pt: 0.92, style: solid, cap: round, join: round}
    graph_feedback: {color: connector, width_pt: 0.72, style: dashed, cap: round, join: round}
