extends: rolling-diffusion.yaml

meta:
  name: hoffman
  version: 3
  description: Restrained Hoffman technical storytelling with light academic surfaces, a cinematic dark web hero, integrated panel rails, compact semantic widgets, and an explicit graph grammar.
  intent:
    - Organize Hoffman system explanations into calm, clearly bounded stages with strong reading order.
    - Use full-width charcoal title rails with rounded top corners as an integrated part of each panel.
    - Distinguish observations, actions, latent state, ports, and focal computation through reusable semantic patterns.
    - Pair an immersive full-bleed robot-video hero with dense light editorial method sections at an explicit surface boundary.
  avoid:
    - Clipped or trapezoidal panel title rails, detached title badges, and ornamental header geometry.
    - Reproducing any reference diagram's scientific content, wording, or composition.
    - Encoding important graph roles with hue alone or inventing local colors outside theme tokens.
    - Applying the dark hero palette to every academic section or turning the project site into a generic product landing page.

color:
  roles:
    surface_subtle: {value: "#ECECEA", usage: "Soft panel bodies, grouped graph regions, and inactive widgets"}
    surface_strong: {value: "#5A5A57", usage: "Integrated full-width panel title rails and chapter headers", on_color: text_inverse}
    border: {value: "#B7B8B4", usage: "Panel boundaries, widget dividers, graph-node outlines, and quiet guides"}
    connector: {value: "#2F2F2D", usage: "Primary graph flow, causal arrows, and feedback paths"}

shape:
